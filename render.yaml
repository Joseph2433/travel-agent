# Render 一键部署蓝图（render.com → New → Blueprint → 选本仓库）
# 免费档：无流量 15 分钟后休眠，首次请求冷启动约 30-60s
services:
  - type: web
    name: travel-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # 以下变量在部署时到控制台填写（sync:false = 不写入仓库）
      - key: AMAP_KEY          # 高德 Web 服务 key
        sync: false
      - key: LLM_API_KEY       # 大模型 key（OpenAI 兼容协议）
        sync: false
      - key: LLM_BASE_URL      # 如 https://api.deepseek.com
        sync: false
      - key: LLM_MODEL         # 如 deepseek-chat
        sync: false
      - key: LLM_CHANNEL       # 可选，多渠道时填渠道名（如 xpeach）
        sync: false
      - key: LLM_CHANNELS      # 可选，追加渠道 JSON：[{"name":"xpeach","key":"...","base_url":"https://xpeach.codes/v1","model":"deepseek-flash","format":"responses"}]
        sync: false
      - key: BOCHA_API_KEY     # 可选，博查搜索
        sync: false
      - key: XHS_API_BASE      # 可选，云端 https://mcp.aredink.com/mcp；或自建透传 https://<本服务>/xhs/mcp
        sync: false
      - key: XHS_API_TOKEN     # 可选，x-mcp token；自建透传时填同 XHS_RELAY_TOKEN
        sync: false
      - key: XHS_RELAY_TOKEN   # 可选，自建 x-mcp 透传中继的鉴权串（插件 serverUrl=wss://<本服务>/xhs/ws）
        sync: false
      - key: CORS_ORIGINS      # 填你的 Pages 域名，如 https://<user>.github.io
        sync: false
      - key: AUTH_SEED         # 可选，初始账号 "admin:密码"。配后管理员登录站点可看「监控」面板
        sync: false
      # 监控说明：日志写 backend/data/monitor/*.jsonl（免费档重启即清空），
      # 同时镜像到 stdout —— Render 控制台 → Logs 搜 "monitor:" 可持久回看。
